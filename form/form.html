            <fieldset>
                <legend>Your information</legend>

                    <input id="personname" type="text" name="fullname" placeholder="Full Name">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" value="tuluama2002@byuh.edu">

                <input id="password" type="password" name="pass" value="808-991-5554">
                </div>
                <div class="form-row">
                    <label for="phone">Phone</label>
                <input id="phone" type="tel" name="phone" placeholder="phone">
                </div>
                <div class="form-row">
                    <label for="age">Age</label>
                    <Select name="age" id="age">
                        <option value="blank"></option>
                        <option value="8">8-10</option>
                        <option value="11">11-12</option>
                        <option value="13">13-15</option>
                        <option value="16">16-19</option>
                        <option value="20">20-23</option>
                        <option value="24">24+</option>
                    </Select>
                </div>

                <div class="check-row">
                    <div class="spacer"></div>
                    <label><input type="checkbox" name="remember">Remember Me?</label>

                </div>
                <div class="check-row">
                    <div class="spacer"></div>
                    <label><input type="radio" name="gender" value="male">Male</label>
                </div>
                <div class="check-row">
                    <div class="spacer"></div>
                    <label><input type="radio" name="gender" value="Female">Female</label>
                </div>
               
              
            </fieldset>
        
            <fieldset>
                <legend>club service</legend>
                <div class="form-row">
                    <label for="service">Service Type</label>
                     <Select name="service" id="service">
                        <option value="blank"></option>
                        <option value="blood donation">Blood donation</option>
                        <option value="trash pick-up">Trash pick-up</option>
                        <option value="Car wash">Car wash</option>
                    </Select>
                </div>

                <div class="form-row">
                    <label for="comments">Comments</label>
                    <textarea name="comments" id="comments"></textarea>
                </div>            
            </fieldset>
                <div class="check-row">
                    <div class="spacer"></div>
                    <button type="submit">Sign up</button>
                </div>
                <div id ="message"></div>
        </form>    
    </main>
